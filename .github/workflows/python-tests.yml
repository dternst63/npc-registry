name: Full Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # -------------------------
  # Node / Express API Tests
  # -------------------------
  server-tests:
    name: Server API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test


  # -------------------------
  # Python Narrative Engine Tests
  # -------------------------
  narrative-engine-tests:
    name: Narrative Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: narrative-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run narrative engine tests
        working-directory: narrative-engine
        run: pytest

  # -------------------------
  # Security Probe Scan
  # -------------------------
  security-probe:
    name: Security Hardening Probe
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hardening-probe

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Probe Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Probe
        run: |
          python main.py

      # Optional artifact upload
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: hardening-probe/output