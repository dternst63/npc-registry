name: Frontend Tests + Coverage + UI

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      node:
        required: true
        type: string

jobs:
  frontend-tests:
    runs-on: ${{ inputs.os }}

    env:
      CI: true

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # ---------- Install ----------

      - name: Install dependencies (include native optional deps)
        run: npm ci --include=optional

      # ---------- Unit + Component Tests ----------

      - name: Run frontend tests with coverage gate
        run: npm run test:coverage

      # ---------- Playwright Setup ----------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ---------- UI E2E Tests ----------

      - name: Run Playwright UI tests
        run: npm run test:ui

      # ---------- Artifacts ----------

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report-${{ inputs.os }}-node${{ inputs.node }}
          path: client/coverage

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.os }}-node${{ inputs.node }}
          path: client/playwright-report
